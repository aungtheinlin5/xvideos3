<style>
  :root{
    --bg:#0c0e12;
    --panel:#14171d;
    --panel2:#1b1f27;
    --line:#262b34;
    --text:#e8eaed;
    --muted:#8b93a1;
    --accent:#ff4d5e;
    --accent2:#ffb454;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(255,77,94,.08), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(255,180,84,.06), transparent 60%),
      var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  header{
    padding:16px 14px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    background:rgba(12,14,18,.9);
    backdrop-filter:blur(10px);
    z-index:10;
  }
  @media(min-width:560px){
    header{padding:26px 24px;}
  }
  .brand{
    font-size:12px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:700;
    margin-bottom:3px;
  }
  h1{margin:0; font-size:22px; font-weight:800; letter-spacing:-0.02em;}
  .back-btn{
    display:none;
    padding:9px 16px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--panel2);
    color:var(--text);
    font-size:13px;
    cursor:pointer;
    font-weight:600;
  }
  .back-btn:hover{border-color:var(--accent);}

  main{max-width:1200px; margin:0 auto; padding:16px 14px 50px;}
  @media(min-width:560px){
    main{padding:28px 24px 60px;}
  }

  /* Grid view */
  #gridView .grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:12px;
  }
  @media(min-width:560px){
    #gridView .grid{
      grid-template-columns:repeat(3, 1fr);
      gap:16px;
    }
  }
  @media(min-width:820px){
    #gridView .grid{
      grid-template-columns:repeat(4, 1fr);
      gap:18px;
    }
  }
  @media(min-width:1100px){
    #gridView .grid{
      grid-template-columns:repeat(5, 1fr);
      gap:20px;
    }
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    cursor:pointer;
    transition:transform .18s, border-color .18s;
  }
  @media(min-width:560px){
    .card{border-radius:14px;}
  }
  .card:hover{
    transform:translateY(-4px);
    border-color:var(--accent);
  }
  .thumb-wrap{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    overflow:hidden;
  }
  .thumb-wrap img{
    width:100%; height:100%; object-fit:cover;
    display:block;
  }
  .play-badge{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0);
    transition:background .18s;
  }
  .card:hover .play-badge{background:rgba(0,0,0,.25);}
  .play-badge svg{
    width:44px; height:44px;
    opacity:0;
    transition:opacity .18s, transform .18s;
    filter:drop-shadow(0 2px 8px rgba(0,0,0,.5));
  }
  .card:hover .play-badge svg{opacity:1; transform:scale(1.05);}
  .card-info{padding:8px 9px;}
  .card-info .t{
    font-weight:700;
    font-size:12.5px;
    line-height:1.35;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .card-info .d{color:var(--muted); font-size:10.5px; margin-top:5px;}
  @media(min-width:560px){
    .card-info{padding:13px 14px;}
    .card-info .t{font-size:14.5px;}
    .card-info .d{font-size:11.5px; margin-top:6px;}
  }

  .empty, .loading{
    text-align:center;
    color:var(--muted);
    padding:80px 20px;
    font-size:14px;
  }

  .pagination{
    position:sticky;
    top:0;
    z-index:9;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:6px;
    padding:8px 4px 14px;
    margin:0 -14px 6px;
    flex-wrap:nowrap;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    background:rgba(12,14,18,.92);
    backdrop-filter:blur(10px);
  }
  .pagination::-webkit-scrollbar{display:none;}
  .page-btn{
    flex:0 0 auto;
    min-width:32px;
    height:32px;
    padding:0 8px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--text);
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:border-color .15s, background .15s;
  }
  .page-btn:hover{border-color:var(--accent);}
  .page-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#12070a;
  }
  .page-btn:disabled{
    opacity:.35;
    cursor:not-allowed;
  }
  .page-dots{
    flex:0 0 auto;
    color:var(--muted);
    font-size:13px;
    padding:0 2px;
  }
  .pagination-bottom{
    position:static;
    top:auto;
    margin:20px -14px 0;
    padding:16px 4px 4px;
    background:transparent;
    backdrop-filter:none;
    border-top:1px solid var(--line);
  }
  @media(min-width:560px){
    .pagination{
      gap:8px;
      padding:10px 0 16px;
      margin:0 0 6px;
      flex-wrap:wrap;
      overflow-x:visible;
    }
    .page-btn{
      min-width:36px;
      height:36px;
      padding:0 10px;
      font-size:13px;
    }
    .pagination-bottom{
      margin:26px 0 0;
      padding:20px 0 0;
    }
  }

  /* Skeleton loading */
  .skeleton-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  @media(min-width:560px){
    .skeleton-card{border-radius:14px;}
  }
  .skeleton-thumb{
    width:100%;
    aspect-ratio:16/9;
    background:linear-gradient(100deg, var(--panel2) 30%, #262b34 50%, var(--panel2) 70%);
    background-size:300% 100%;
    animation:shimmer 1.4s ease-in-out infinite;
  }
  .skeleton-lines{padding:8px 9px;}
  @media(min-width:560px){
    .skeleton-lines{padding:13px 14px;}
  }
  .skeleton-line{
    height:10px;
    border-radius:5px;
    background:linear-gradient(100deg, var(--panel2) 30%, #262b34 50%, var(--panel2) 70%);
    background-size:300% 100%;
    animation:shimmer 1.4s ease-in-out infinite;
    margin-bottom:6px;
  }
  .skeleton-line.short{width:55%; margin-bottom:0;}
  @keyframes shimmer{
    0%{background-position:100% 0;}
    100%{background-position:-100% 0;}
  }

  /* Player view */
  #playerView{display:none;}
  .player-wrap{
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border-radius:14px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .player-wrap iframe{
    width:100%; height:100%;
    border:0; display:block;
  }
  .player-title{
    font-size:17px;
    font-weight:800;
    margin:14px 0 5px;
    letter-spacing:-0.01em;
  }
  .player-date{color:var(--muted); font-size:12px;}
  @media(min-width:560px){
    .player-title{font-size:21px; margin:20px 0 6px;}
    .player-date{font-size:13px;}
  }

  /* Related videos */
  .related-heading{
    font-size:14px;
    font-weight:800;
    letter-spacing:.02em;
    margin:26px 0 12px;
    padding-top:16px;
    border-top:1px solid var(--line);
    color:var(--text);
  }
  @media(min-width:560px){
    .related-heading{font-size:16px; margin:32px 0 14px;}
  }
  #relatedGrid.grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:12px;
  }
  @media(min-width:560px){
    #relatedGrid.grid{
      grid-template-columns:repeat(3, 1fr);
      gap:16px;
    }
  }
  @media(min-width:820px){
    #relatedGrid.grid{
      grid-template-columns:repeat(4, 1fr);
      gap:18px;
    }
  }
  @media(min-width:1100px){
    #relatedGrid.grid{
      grid-template-columns:repeat(5, 1fr);
      gap:20px;
    }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1 id="headerTitle">Dr.X</h1>
  </div>
  <button class="back-btn" id="backBtn" onclick="goBack()">← နောက်သို့</button>
</header>

<main>

  <div id="gridView">
    <div id="pagination" class="pagination"></div>
    <div id="videoGrid" class="grid">
      <div class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-lines"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
      <div class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-lines"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
      <div class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-lines"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
      <div class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-lines"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
      <div class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-lines"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
      <div class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-lines"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
    </div>
    <div id="paginationBottom" class="pagination pagination-bottom"></div>
  </div>

  <div id="playerView">
    <div class="player-wrap">
      <iframe id="playerFrame" src="" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
    </div>
    <div class="player-title" id="playerTitle"></div>
    <div class="player-date" id="playerDate"></div>

    <div class="related-heading">ဆက်စပ် Video များ</div>
    <div id="relatedGrid" class="grid"></div>
  </div>

</main>

<script>
// ============ CONFIG ============
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbytN8k3DZ-kE40iBpwfHgowMt2jFFXmDOqHgB_jDfTeoEMVfI_lafDA5G1r7Wg8PeH-/exec";
// =================================

let videos = [];
let currentPage = 1;
const PAGE_SIZE = 15;
let activeVideoIndex = null;

// Keep two same-URL history entries on the home page.
// First back: remain on home. Second back: leave the page.
const HOME_STATE = "drx-home";
const HOME_GUARD_STATE = "drx-home-guard";
const VIDEO_STATE = "drx-video";
history.replaceState({ drxApp: HOME_STATE }, "", location.href);
history.pushState({ drxApp: HOME_GUARD_STATE }, "", location.href);

// Handle browser / Android back navigation before the Popunder provider sees it.
window.addEventListener('popstate', (event) => {
  event.stopImmediatePropagation();
  const state = event.state || {};

  if(state.drxApp === VIDEO_STATE && Number.isInteger(state.videoIndex)){
    renderVideo(state.videoIndex);
  }else{
    showGrid(true);
  }
}, true);

// The in-page back button follows the same history path as hardware/browser back.
// Capture it at window level so the Popunder cannot handle this click first.
function isBackButtonEvent(event){
  const target = event.target;
  return !!(target && target.closest && target.closest('#backBtn'));
}

window.addEventListener('pointerdown', (event) => {
  if(isBackButtonEvent(event)){
    event.preventDefault();
    event.stopImmediatePropagation();
  }
}, true);

window.addEventListener('click', (event) => {
  if(isBackButtonEvent(event)){
    event.preventDefault();
    event.stopImmediatePropagation();
    goBack();
  }
}, true);

async function loadVideos(){
  const gridEl = document.getElementById('videoGrid');
  const pagEl = document.getElementById('pagination');
  try{
    const res = await fetch(SCRIPT_URL + "?action=list");
    const data = await res.json();

    if(!data.success || data.videos.length === 0){
      gridEl.className = "empty";
      gridEl.innerHTML = "Video များ မရှိသေးပါ";
      pagEl.innerHTML = "";
      return;
    }

    videos = data.videos;
    gridEl.className = "grid";
    renderPage(1);
  } catch(err){
    gridEl.className = "empty";
    gridEl.innerHTML = "Data ရယူရာတွင် အမှားရှိသည်။ SCRIPT_URL ကိုစစ်ဆေးပါ";
    pagEl.innerHTML = "";
  }
}

function renderPage(page){
  currentPage = page;
  const gridEl = document.getElementById('videoGrid');
  const totalPages = Math.ceil(videos.length / PAGE_SIZE);
  const start = (page - 1) * PAGE_SIZE;
  const pageVideos = videos.slice(start, start + PAGE_SIZE);

  gridEl.innerHTML = pageVideos.map((v) => {
    const realIndex = videos.indexOf(v);
    return `
      <div class="card" onclick="playVideo(${realIndex})">
        <div class="thumb-wrap">
          <img src="${v.thumbnailLink}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x225/1b1f27/8b93a1?text=No+Image'">
          <div class="play-badge">
            <svg viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
        <div class="card-info">
          <div class="t">${escapeHtml(v.title)}</div>
          <div class="d">${new Date(v.dateAdded).toLocaleDateString()}</div>
        </div>
      </div>
    `;
  }).join('');

  renderPagination(page, totalPages);
  positionPagination();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderPagination(page, totalPages){
  const pagEl = document.getElementById('pagination');
  const pagBottomEl = document.getElementById('paginationBottom');
  if(totalPages <= 1){
    pagEl.innerHTML = "";
    if(pagBottomEl) pagBottomEl.innerHTML = "";
    return;
  }

  // Estimate how many numbered buttons fit on screen, then show a
  // continuous run starting at 1 (1,2,3,4... not 1 ... x-1,x,x+1 ... n).
  const btnSpace = window.innerWidth < 560 ? 34 : 44;
  const reserved = 2 * (window.innerWidth < 560 ? 34 : 44) + 40; // prev/next + dots/margins
  const available = Math.max(window.innerWidth - reserved, btnSpace * 3);
  let maxVisible = Math.max(3, Math.floor(available / btnSpace));
  maxVisible = Math.min(maxVisible, totalPages);

  // Keep the current page within the visible run, sliding the window
  // forward as the user pages deeper, but always start from 1 when possible.
  let startPage = 1;
  if(page > maxVisible){
    startPage = Math.min(page - maxVisible + 1, totalPages - maxVisible + 1);
  }
  const endPage = Math.min(startPage + maxVisible - 1, totalPages);

  let html = `<button class="page-btn" ${page === 1 ? "disabled" : ""} onclick="renderPage(${page - 1})">‹</button>`;

  if(startPage > 1){
    html += `<button class="page-btn" onclick="renderPage(1)">1</button>`;
    if(startPage > 2) html += `<span class="page-dots">…</span>`;
  }

  for(let p = startPage; p <= endPage; p++){
    html += `<button class="page-btn ${p === page ? 'active' : ''}" onclick="renderPage(${p})">${p}</button>`;
  }

  if(endPage < totalPages){
    if(endPage < totalPages - 1) html += `<span class="page-dots">…</span>`;
    html += `<button class="page-btn" onclick="renderPage(${totalPages})">${totalPages}</button>`;
  }

  html += `<button class="page-btn" ${page === totalPages ? "disabled" : ""} onclick="renderPage(${page + 1})">›</button>`;

  pagEl.innerHTML = html;
  if(pagBottomEl) pagBottomEl.innerHTML = html;
}

function toEmbedUrl(link){
  // Mux stream URLs (https://stream.mux.com/PLAYBACK_ID.m3u8) can't play
  // directly in a plain <iframe>, so point to Mux's own embeddable player.
  const muxMatch = link.match(/stream\.mux\.com\/([^.\/]+)\.m3u8/);
  if(muxMatch){
    return "https://player.mux.com/" + muxMatch[1];
  }
  return link;
}

function playVideo(index){
  const nextState = { drxApp: VIDEO_STATE, videoIndex: index };

  // Replace related-video states so every video-view back press returns to home.
  if(history.state && history.state.drxApp === VIDEO_STATE){
    history.replaceState(nextState, "", location.href);
  }else{
    // Recreate the home guard if the user already used the first back press.
    if(history.state && history.state.drxApp === HOME_STATE){
      history.pushState({ drxApp: HOME_GUARD_STATE }, "", location.href);
    }
    history.pushState(nextState, "", location.href);
  }

  renderVideo(index);
}

function renderVideo(index){
  const v = videos[index];
  if(!v) return;
  activeVideoIndex = index;

  document.getElementById('playerFrame').src = toEmbedUrl(v.videoLink);
  document.getElementById('playerTitle').textContent = v.title;
  document.getElementById('playerDate').textContent = new Date(v.dateAdded).toLocaleString();

  document.getElementById('gridView').style.display = "none";
  document.getElementById('playerView').style.display = "block";
  document.getElementById('backBtn').style.display = "inline-block";
  document.getElementById('headerTitle').textContent = "ပြသနေသည်";
  renderRelated(index);
  window.scrollTo(0,0);
}

function goBack(){
  if(history.state && history.state.drxApp === VIDEO_STATE){
    history.back();
  }else{
    showGrid(true);
  }
}

function renderRelated(currentIndex){
  const relEl = document.getElementById('relatedGrid');
  if(!relEl) return;

  // Build a pool of all video indices except the one currently playing.
  const pool = videos.map((_, i) => i).filter(i => i !== currentIndex);

  // Shuffle the pool (Fisher–Yates) and take up to 10.
  for(let i = pool.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  const pick = pool.slice(0, 10);

  if(pick.length === 0){
    relEl.innerHTML = "";
    return;
  }

  relEl.innerHTML = pick.map((i) => {
    const v = videos[i];
    return `
      <div class="card" onclick="playVideo(${i})">
        <div class="thumb-wrap">
          <img src="${v.thumbnailLink}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x225/1b1f27/8b93a1?text=No+Image'">
          <div class="play-badge">
            <svg viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
        <div class="card-info">
          <div class="t">${escapeHtml(v.title)}</div>
          <div class="d">${new Date(v.dateAdded).toLocaleDateString()}</div>
        </div>
      </div>
    `;
  }).join('');
}

function showGrid(fromHistory = false){
  if(!fromHistory && history.state && history.state.drxApp === VIDEO_STATE){
    history.back();
    return;
  }

  activeVideoIndex = null;
  document.getElementById('playerFrame').src = "";
  document.getElementById('gridView').style.display = "block";
  document.getElementById('playerView').style.display = "none";
  document.getElementById('backBtn').style.display = "none";
  document.getElementById('headerTitle').textContent = "Dr.X";
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function positionPagination(){
  const header = document.querySelector('header');
  const pagEl = document.getElementById('pagination');
  if(header && pagEl){
    pagEl.style.top = header.offsetHeight + "px";
  }
}
window.addEventListener('resize', () => {
  positionPagination();
  if(videos.length) renderPagination(currentPage, Math.ceil(videos.length / PAGE_SIZE));
});
positionPagination();

loadVideos();
</script>
